[package]
name = "hyperpace-app"
description = "Hyperpace desktop application: commands, tray, notifications and window lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hyperpace_app"
path = "src/lib.rs"

[[bin]]
name = "hyperpace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.0", features = ["config-json"] }

[dependencies]
hyperpace-protocol = { path = "../hyperpace-protocol", version = "0.1.0" }
hyperpace-device = { path = "../hyperpace-device", version = "0.1.0" }
hyperpace-firmware = { path = "../hyperpace-firmware", version = "0.1.0" }
hyperpace-store = { path = "../hyperpace-store", version = "0.1.0" }

tauri = { version = "3.0.0-alpha.1", features = ["tray-icon"] }
# tauri 3.0.0-alpha no longer bundles a concrete window backend behind a default feature; the app
# crate now selects one explicitly via `Builder::runtime`, so this is a direct dependency rather
# than a feature flag.
tauri-runtime-wry = "3.0.0-alpha.0"
tauri-plugin-autostart = "3.0.0-alpha.0"
tauri-plugin-single-instance = "3.0.0-alpha.0"
tauri-plugin-notification = "3.0.0-alpha.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured logging facade (docs/plans/hyperpace.md's "Known gaps still open" table): already a
# transitive dependency through tauri and its plugins, so this only names a version this crate
# calls directly rather than pulling anything new in. "env-filter" is likewise already fully
# resolved transitively (loom, a dev-dependency elsewhere in the graph, already enables it), so
# reusing it here costs nothing extra.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only used to name the local firmware archive's files by content hash (`hyperpace-store`'s
# `FirmwareRecord::sha256`); not used for anything security-sensitive.
sha2 = "0.10"
# Firmware watch route (docs/plans/hyperpace.md's firmware paragraph): fetches the vendor's own
# config files and firmware directory paths, nothing else, never a firmware image. `reqwest`'s own
# default TLS feature ("rustls") pulls in an aws-lc-sys/cmake native build step nothing else in
# this workspace needs; "rustls-no-provider" skips that and this crate installs the `ring` crypto
# provider itself at startup instead (see `run`), matching the dependency policy's no-new-heavy-
# dependency-without-review rule (docs/decs/hyperpace_DECS.md).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tauri-plugin-dialog = "3.0.0-alpha.0"

[dev-dependencies]
# Same version `hyperpace-store` already pins; used here to open a temporary local store for
# `commands::data` and the event log retention tests, the one place in this crate that needs a
# real `Store` rather than a pure function or the device simulator.
tempfile = "3"

[lints]
workspace = true
