[workspace]
resolver = "3"
members = [
    "crates/hyperpace-protocol",
    "crates/hyperpace-device",
    "crates/hyperpace-firmware",
    "crates/hyperpace-store",
    "crates/hyperpace-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vertexclique/hyperpace"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
